<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transactions | Moneywise</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="nav"><a class="brand" href="/dashboard.html">Money<span>wise</span></a><div class="nav-links"><a href="/dashboard.html">Dashboard</a><a class="active" href="/transactions.html">Transactions</a><button id="logout" class="button secondary">Log out</button></div></nav><main class="container"><div class="page-heading"><div><h1>Transactions</h1><p>Record and manage every income and expense.</p></div></div><section class="panel"><h2 id="form-title">Add transaction</h2><form id="transaction-form" class="form-grid"><div class="field"><label>Type</label><select id="type" name="type"><option value="expense">Expense</option><option value="income">Income</option></select></div><div class="field"><label>Amount (₹)</label><input id="amount" name="amount" required min="0.01" step="0.01" type="number" placeholder="0"></div><div class="field"><label>Category</label><select id="category" name="category"></select></div><div class="field"><label>Description</label><input id="description" name="description" required maxlength="140" placeholder="e.g. Grocery shopping"></div><div class="field"><label>Date</label><input id="date" name="date" required type="date"></div><button id="save" class="button" style="grid-column:1/-1;justify-self:start">Add transaction</button></form></section><section class="panel transactions-panel"><h2>All transactions</h2><div class="filters"><select class="filter" name="type"><option value="">All types</option><option value="income">Income</option><option value="expense">Expense</option></select><select class="filter" name="category"><option value="">All categories</option><option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Entertainment</option><option>Education</option><option>Health</opti
