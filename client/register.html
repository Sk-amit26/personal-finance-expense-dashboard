<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Moneywise</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/auth.css"></head><body class="auth-page"><main class="auth-card"><a class="brand" href="/">Money<span>wise</span></a><h1>Create account</h1><p>Start building a clearer financial picture.</p><form data-mode="register"><div class="field"><label>Name</label><input required name="name" maxlength="60" autocomplete="name"></div><div class="field"><label>Email</label><input required type="email" name="email" autocomplete="email"></div><div class="field"><label>Password</label><input required type="password" name="password" minlength="6" autocomplete="new-password"></div><div class="field"><label>Confirm password</label><input required type="password" name="confirmPassword" minlength="6" autocomplete="new-password"></div><p class="message"></p><button class="button">Create account</button></form><div class="auth-foot">Already registered? <a href="/login.html">Log in</a></div></main><script src="/js/api.js"></script><script src="/js/auth.js"></script></body></html>
