<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What-If Simulator & Financial Tools | Moneywise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/tools.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/dashboard.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Money<span>wise</span>
    </a>
    <button class="mobile-menu-btn" aria-label="Toggle navigation">☰</button>
    <div class="nav-links">
      <a href="/dashboard.html">Dashboard</a>
      <a href="/transactions.html">Transactions</a>
      <a href="/goals.html">Goals</a>
      <a class="active" href="/tools.html">Tools</a>
    </div>
    <div class="nav-actions">
      <span class="user-badge" id="user-name">User</span>
      <button class="theme-toggle" aria-label="Toggle theme">🌙</button>
      <button id="logout" class="button secondary small">Log out</button>
      <button id="delete-account-btn" class="button danger small" title="Permanently delete account">Delete</button>
    </div>

  </nav>

  <main class="container">
    <div class="page-heading">
      <div>
        <p class="eyebrow">FINANCIAL SIMULATOR</p>
        <h1>What-If Scenario Calculator</h1>
        <p>Simulate the long-term impact of cutting expenses, salary hikes, or compounding returns over 1 to 5 years.</p>
      </div>
    </div>

    <div class="tools-layout">
      <!-- Calculator Controls -->
      <section class="panel">
        <h2>Simulation Parameters</h2>
        <form id="simulator-form">
          <div class="field" style="margin-bottom:14px">
            <label>Monthly Inflow / Income (₹)</label>
            <input required type="number" id="base-income" min="0" step="1" placeholder="50000">
          </div>

          <div class="field" style="margin-bottom:14px">
            <label>Monthly Outflow / Expenses (₹)</label>
            <input required type="number" id="base-expense" min="0" step="1" placeholder="30000">
          </div>

          <div class="field" style="margin-bottom:14px">
            <label>Proposed Monthly Expense Cut (₹)</label>
            <input type="number" id="expense-cut" min="0" step="1" value="2000" placeholder="e.g. Cut ₹2,000 on dining/subscriptions">
          </div>

          <div class="field" style="margin-bottom:14px">
            <label>Proposed Monthly Income Boost (₹)</label>
            <input type="number" id="income-boost" min="0" step="1" value="5000" placeholder="e.g. Freelance ₹5,000">
          </div>

          <div class="field" style="margin-bottom:14px">
            <label>Annual Return on Savings (%)</label>
            <input type="number" id="investment-rate" min="0" max="30" step="0.5" value="10" placeholder="10% (Mutual Funds / SIP)">
          </div>

          <div class="field" style="margin-bottom:20px">
            <label>Time Horizon (Years)</label>
            <select id="time-horizon">
              <option value="1">1 Year (12 months)</option>
              <option value="2">2 Years (24 months)</option>
              <option value="3" selected>3 Years (36 months)</option>
              <option value="5">5 Years (60 months)</option>
            </select>
          </div>

          <button class="button" style="width:100%">Run Simulation 🔮</button>
        </form>
      </section>

      <!-- Simulation Results & Chart -->
      <section class="panel">
        <h2>Projected Trajectory & Wealth Growth</h2>

        <div class="result-summary">
          <div class="result-card">
            <label>Baseline Savings</label>
            <strong id="res-baseline">₹0</strong>
          </div>
          <div class="result-card">
            <label>Simulated Wealth</label>
            <strong id="res-simulated" style="color:var(--green)">₹0</strong>
          </div>
          <div class="result-card">
            <label>Extra Wealth Created</label>
            <strong id="res-extra" style="color:var(--blue)">₹0</strong>
          </div>
        </div>

        <div class="chart-wrap" style="height:320px">
          <canvas id="projectionChart"></canvas>
        </div>
      </section>
    </div>
  </main>

  <div class="toast"></div>
  <script src="/js/api.js"></script>
  <script src="/js/tools.js"></script>
</body>
</html>
